name: Project checks
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run assets:fetch
      - name: Check source
        run: |
          git diff --check
          for file in scripts/*.mjs; do node --check "$file"; done
          if [ "${{ github.event_name }}" = pull_request ]; then
            git show --format= --check HEAD
          fi
      - run: npm run build
      - run: npm test
