name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: Description and reproduction steps
      description: Include the car, camera view, and inputs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, device and game version or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal information before attaching evidence.
